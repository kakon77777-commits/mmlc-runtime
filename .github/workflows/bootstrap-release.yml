name: Bootstrap MMLC Runtime v1.0

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release archive
        shell: bash
        run: |
          set -euo pipefail
          source_dir="bootstrap_v1_small"
          test -d "$source_dir"

          mapfile -t chunks < <(
            find "$source_dir" -maxdepth 1 -type f -name 'chunk_*' | sort
          )
          test "${#chunks[@]}" -eq 6

          cat "${chunks[@]}" \
            | tr -d '\r\n\t ' \
            | base64 --decode \
            > /tmp/mmlc-runtime-v1.0.tar.xz

          test -s /tmp/mmlc-runtime-v1.0.tar.xz
          xz --test /tmp/mmlc-runtime-v1.0.tar.xz

          rm -rf /tmp/mmlc-release
          mkdir -p /tmp/mmlc-release
          tar -xJf /tmp/mmlc-runtime-v1.0.tar.xz -C /tmp/mmlc-release

          release_root=$(find /tmp/mmlc-release -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$release_root"
          test -f "$release_root/README.md"
          test -f "$release_root/pyproject.toml"
          test -d "$release_root/mmlc"
          test -f "$release_root/examples/mmlf_v1_stable.yaml"

      - name: Replace bootstrap tree with public v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          release_root=$(find /tmp/mmlc-release -mindepth 1 -maxdepth 1 -type d | head -n 1)

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$release_root"/. ./

          rm -rf bootstrap bootstrap16 bootstrapxz bootstrapmin bootstrap_v1_small
          rm -f .github/workflows/bootstrap-release.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release MMLC Runtime v1.0.0'
          git push origin HEAD:main
