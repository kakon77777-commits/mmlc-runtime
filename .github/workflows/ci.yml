name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: mmlc validate examples/mmlf_v1_stable.yaml
      - run: mmlc migrate examples/four_operations.yaml --output /tmp/four_operations_v1.yaml
      - run: mmlc run examples/mmlf_v1_stable.yaml --output /tmp/mmlc-run --deterministic --fail-on-audit
