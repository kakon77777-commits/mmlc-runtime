format: MMLF
version: "0.9"
ledger_id: fdcs-continuous-correlated
branches:
  - id: shock_a
    base: 0
    operator: identity
    expected_result: 0
  - id: shock_b
    base: 0
    operator: identity
    expected_result: 0
  - id: combined
    base: {ref: shock_a}
    operator: add
    operand: {ref: shock_b}
layout:
  - [shock_a, shock_b, combined]
fdcs:
  enabled: true
  base_context: observed
  parallel_workers: 8
  probability_model:
    tolerance: 1.0e-12
  continuous_uncertainty:
    enabled: true
    max_samples: 1024
    ensembles:
      - id: correlated-shocks
        policy_id: uncertainty-only
        samples: 256
        correlation_matrix:
          - [1.0, 0.65]
          - [0.65, 1.0]
        variables:
          - id: a
            target_tx_id: shock_a
            intervention_kind: do_set
            distribution: normal
            mean: 2.0
            stddev: 1.5
          - id: b
            target_tx_id: shock_b
            intervention_kind: do_set
            distribution: normal
            mean: -1.0
            stddev: 0.5
