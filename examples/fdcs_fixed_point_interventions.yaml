format: MMLF
version: "0.7"
ledger_id: fdcs-fixed-point-interventions
branches:
  - id: x
    base: {ref: y, field: result}
    operator: affine
    operand: 1
    context: {scale: 0.5}
    expected_result: 2
  - id: y
    base: {ref: x, field: result}
    operator: affine
    operand: 1
    context: {scale: 0.5}
    expected_result: 2
layout:
  - [x, y]
fixed_point_groups:
  - id: xy-equilibrium
    members: [x, y]
    method: jacobi
    tolerance: 1.0e-13
    max_iterations: 300
    initial_values: {x: 0, y: 0}
fdcs:
  enabled: true
  base_context: observed
  parallel_workers: 2
  contexts:
    - id: hard-x-four
      interventions:
        - id: set-x-four
          kind: do_set
          target_tx_id: x
          value: 4
    - id: soft-x-shift
      interventions:
        - id: shift-x-one
          kind: soft_shift
          target_tx_id: x
          shift: 1
