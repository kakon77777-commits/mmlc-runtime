format: MMLF
version: "0.9"
ledger_id: fdcs-sequential-information-value
branches:
  - {id: signal_a, base: 0, operator: identity, expected_result: 0}
  - {id: signal_b, base: 0, operator: identity, expected_result: 0}
  - {id: outcome, base: 0, operator: identity, expected_result: 0}
layout:
  - [signal_a, signal_b, outcome]
fdcs:
  enabled: true
  base_context: observed
  parallel_workers: 8
  probability_model:
    tolerance: 1.0e-12
  policy_selection:
    enabled: true
    risk_aversion: 0.0
    cost_weight: 0.0
    objectives:
      - {tx_id: outcome, direction: maximize, weight: 1.0}
  information_value:
    enabled: true
    horizon: 2
    max_horizon: 3
    candidate_transactions: [signal_a, signal_b]
    observation_costs:
      signal_a: 0.5
      signal_b: 0.5
  contexts:
    - id: policy-0-state-0
      policy_id: policy-0
      scenario_id: state-0
      probability: 0.25
      interventions:
