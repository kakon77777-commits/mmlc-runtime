format: MMLF
version: "0.5"
ledger_id: fixed-point-divergent
branches:
  - id: x
    base: {ref: y, field: result}
    operator: affine
    operand: 1
    context: {scale: 1.1}
  - id: y
    base: {ref: x, field: result}
    operator: affine
    operand: 1
    context: {scale: 1.1}
layout:
  - [x, y]
fixed_point_groups:
  - id: xy-divergent
    members: [x, y]
    tolerance: 1.0e-12
    max_iterations: 20
    initial_values: {x: 0, y: 0}
